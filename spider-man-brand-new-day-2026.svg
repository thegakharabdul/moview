<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spider-Man: Brand New Day</title>
  <desc id="desc">Local poster for Spider-Man Brand New Day 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111b" />
      <stop offset="50%" stop-color="#123f7a" />
      <stop offset="100%" stop-color="#a91c2f" />
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#8fd2ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8fd2ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="200" r="170" fill="url(#burst)" />
  <rect x="58" y="68" width="484" height="764" rx="32" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.16)" stroke-width="2" />
  <text x="300" y="214" text-anchor="middle" fill="#ffe0e0" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">A NEW START</text>
  <text x="300" y="406" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">SPIDER-MAN</text>
  <text x="300" y="470" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">BRAND NEW DAY</text>
  <text x="300" y="532" text-anchor="middle" fill="#ffe7a8" font-family="Arial, sans-serif" font-size="24" font-weight="700">2026</text>
  <text x="300" y="640" text-anchor="middle" fill="#dce8f5" font-family="Arial, sans-serif" font-size="22">Responsibility. Reset. Hope.</text>
</svg>